          "@type": "Question",
          "name": "Where are SpecTa Education offices located?",

            "@type": "Answer",
            "text": "SpecTa Education has 3 offices: Head Office in Kelapa Gading (Jl. Kelapa Nias Raya QE1 No. 14, Jakarta Utara), PIK Branch (Ruko Galeri Niaga Jl. Pantai Indah Utara II Blok J No. 8 B), and Gading Serpong Branch (Jl. Paramount Boulevard Pisa Grande A ext. 11, Tangerang). All offices are open Mon-Fri 10AM-6PM and Saturday 10AM-2PM."

          "@type": "Question",
          "name": "Does SpecTa Education offer scholarship assistance?",

          "name": "What is the Tes Bakat AI (AI Aptitude Test)?",
